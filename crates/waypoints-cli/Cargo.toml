[package]
name = "waypoints-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "waypoints"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
waypoints-backend = { path = "../waypoints-backend" }
waypoints-core = { path = "../waypoints-core" }
waypoints-desktop-ipc = { path = "../waypoints-desktop-ipc" }

[dev-dependencies]
tempfile = "3"
turso = { version = "0.8.3", default-features = false }
