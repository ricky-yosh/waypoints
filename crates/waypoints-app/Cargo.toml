[package]
name = "waypoints-app"
version = "0.1.0"
edition = "2024"

[features]
hot-reload = ["gpui-kit/hot-reload"]

[dependencies]
anyhow = "1.0.104"
dirs = "6"
gpui-kit = { version = "=0.9.0", features = ["inspector"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "net", "time", "sync"] }
waypoints-backend = { path = "../waypoints-backend" }
waypoints-core = { version = "0.1.0", path = "../waypoints-core" }

[dev-dependencies]
gpui-kit = { version = "=0.9.0", features = ["test-support"] }
