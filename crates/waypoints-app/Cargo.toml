[package]
name = "waypoints-app"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "a8ca769b944598e179f33cc6843629b90e6ca831", default-features = false, features = ["accessibility", "dbus", "embedded-fonts", "metal-backend", "native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "a8ca769b944598e179f33cc6843629b90e6ca831", features = ["markdown"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }
waypoints-backend = { path = "../waypoints-backend" }
waypoints-core = { path = "../waypoints-core" }
waypoints-desktop-ipc = { path = "../waypoints-desktop-ipc" }

[dev-dependencies]
tempfile = "3"
