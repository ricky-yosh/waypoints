[package]
name = "waypoints-app"
version = "0.1.0"
edition = "2024"

[features]
hot-reload = ["gpui-kit/hot-reload"]
screenshot-fixtures = ["gpui-kit/test-support"]
native-qa = ["screenshot-fixtures"]

[[bin]]
name = "waypoints-screenshots"
path = "src/bin/screenshots.rs"
required-features = ["screenshot-fixtures"]

[[bin]]
name = "waypoints-native-qa"
path = "src/bin/native_qa.rs"
required-features = ["native-qa"]

[dependencies]
anyhow = "1.0.104"
dirs = "6"
gpui-kit = { version = "=0.9.0", features = ["gpui-fast", "inspector", "syntect"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "net", "time", "sync"] }
waypoints-backend = { path = "../waypoints-backend" }
waypoints-core = { version = "0.1.0", path = "../waypoints-core" }

[dev-dependencies]
gpui-kit = { version = "=0.9.0", features = ["gpui-fast", "test-support"] }
