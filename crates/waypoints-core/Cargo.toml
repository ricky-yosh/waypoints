[package]
name = "waypoints-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "process", "sync", "time"] }
turso = { version = "0.8.3", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"
