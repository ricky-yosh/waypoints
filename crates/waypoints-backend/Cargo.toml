[package]
name = "waypoints-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "signal", "macros"] }
waypoints-core = { path = "../waypoints-core" }
